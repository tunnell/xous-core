[package]
name = "chat"
version = "0.1.0"
authors = ["john <john@nhoj.info>"]
edition = "2018"
description = "Chat UI over pddb records"

# Dependency versions enforced by Cargo.lock.
[dependencies]
log = "0.4.14"
num-derive = { version = "0.4.2", default-features = false }
num-traits = { version = "0.2.14", default-features = false }
xous = "0.9.70"
xous-ipc = "0.10.10"
log-server = { package = "xous-api-log", version = "0.1.69" }
ticktimer-server = { package = "xous-api-ticktimer", version = "0.9.70" }
xous-names = { package = "xous-api-names", version = "0.9.71" }
gam = { path = "../../services/gam" }
ux-api = { path = "../../libs/ux-api" }
blitstr2 = { path = "../blitstr2" }
trng = { path = "../../services/trng" }
locales = { path = "../../locales" }
ime-plugin-api = { path = "../../services/ime-plugin-api" }
ime-plugin-shell = { path = "../../services/ime-plugin-shell" }
content-plugin-api = { path = "../../services/content-plugin-api" }       # all content canvas providers must provide this API
com = { path = "../../services/com" }
llio = { path = "../../services/llio" }
modals = { path = "../../services/modals" }
codec = { path = "../../services/codec" }
cos_table = { path = "../../libs/cos_table" }
pddb = { path = "../../services/pddb" }

enumset = "1.1.2"
rkyv = { version = "0.8.8", default-features = false, features = [
    "std",
    "alloc",
] }

[features]
default = []
# Forward the shared build-profile flags to blitstr2 (the emoji font
# the delivery-mark glyphs need, ISSUES r6 row 20b) and ux-api,
# mirroring the fan-out crates/sigchat/Cargo.toml already does for its
# own direct blitstr2/ux-api dependencies. Nothing in a real app build
# depends on this: sigchat activates blitstr2/hosted and ux-api/hosted
# directly, not through this crate. Needed only so `cargo test -p
# chat --features hosted` (ignore/notes-r5-author-identity.md section
# 8) can select a feature set blitstr2 actually compiles under; its
# own default (no font-table features at all) does not build.
hosted = [
    "blitstr2/hosted",
    "ux-api/hosted",
    "gam/hosted",
    "modals/hosted",
    "pddb/hosted",
    "llio/hosted",
    "com/hosted",
    "codec/hosted",
]
precursor = [
    "blitstr2/precursor",
    "ux-api/precursor",
    "gam/precursor",
    "modals/precursor",
    "pddb/precursor",
    "llio/precursor",
    "com/precursor",
    "codec/precursor",
]
